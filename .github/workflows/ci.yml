name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate ZeroDrop test inbox
        id: inbox
        # Pinned to a SHA, as the docs recommend. Replaces the archived
        # create-inbox action, whose Marketplace listing was retired during the
        # org migration. With api-key, the inbox name starts with the key's
        # prefix, only that key can read it, and mail to it isn't held by the
        # keyless limit (5 inboxes a day per sender). The action also sets
        # ZERODROP_API_KEY for the steps that follow, where the tests read it.
        uses: zerodrop-dev/setup-zerodrop@aa882ace46b204bfd84bbcc374df73d32cf67343 # v1.1.0
        with:
          api-key: ${{ secrets.ZERODROP_API_KEY }}

      # lib/email.ts sends from RESEND_FROM, an address on a domain verified
      # in the Resend account that RESEND_API_KEY belongs to.
      - name: Build app
        run: npm run build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: noreply@zerodrop-sandbox.online

      - name: Start app
        run: npx next start -p 3000 &
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: noreply@zerodrop-sandbox.online

      - name: Wait for app to be ready
        run: npx wait-on tcp:3000 --timeout 60000

      - name: Run Playwright tests
        run: npx playwright test
        env:
          TEST_INBOX: ${{ steps.inbox.outputs.inbox }}
          BASE_URL: http://localhost:3000
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
